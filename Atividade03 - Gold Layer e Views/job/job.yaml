resources:
  jobs:
    Execução_atividade_run:
      name: Execução atividade run
      schedule:
        quartz_cron_expression: 39 0 13 * * ?
        timezone_id: America/Sao_Paulo
        pause_status: UNPAUSED
      tasks:
        - task_key: extracao_bronze
          notebook_task:
            notebook_path: /Workspace/Users/emanoelthyago3002@gmail.com/RocketLabDados-2025.2/Atividade02
              - Medalhao/Atividade2_land_to_bronze
            source: WORKSPACE
          environment_key: Default
        - task_key: conversao_silver
          depends_on:
            - task_key: extracao_bronze
          notebook_task:
            notebook_path: /Workspace/Users/emanoelthyago3002@gmail.com/RocketLabDados-2025.2/Atividade02
              - Medalhao/Atividade2_bronze_to_silver
            source: WORKSPACE
          environment_key: Default
        - task_key: transformacao_gold
          depends_on:
            - task_key: conversao_silver
          notebook_task:
            notebook_path: /Workspace/Users/emanoelthyago3002@gmail.com/RocketLabDados-2025.2/Atividade03
              - Gold Layer e Views/Atividade3_silver_to_gold.ipynb
            source: WORKSPACE
      queue:
        enabled: true
      environments:
        - environment_key: Default
          spec:
            environment_version: "4"
      performance_target: PERFORMANCE_OPTIMIZED
